[package]
name = "llmpool-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "llmpool"
path = "src/main.rs"

[dependencies]
llmpool-core = { path = "../llmpool-core" }
llmpool-adapter-claude = { path = "../llmpool-adapter-claude" }
llmpool-daemon = { path = "../llmpool-daemon" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
tempfile = "3"

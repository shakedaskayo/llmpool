<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- A plain mark: a ring and what it holds. Drawn on the macOS icon grid
       (824 square, rounded), light on near-black. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2c30"/>
      <stop offset="1" stop-color="#101113"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d9dbe0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#plate)"/>
  <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="3"/>
  <circle cx="512" cy="512" r="212" fill="none" stroke="url(#ink)" stroke-width="58"/>
  <circle cx="512" cy="512" r="92" fill="url(#ink)"/>
</svg>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>llmpool</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <a class="skip" href="#main">Skip to content</a>
    <header>
      <h1>llmpool</h1>
      <div role="tablist" aria-label="Sections" id="tabs">
        <button role="tab" id="tab-pool" aria-controls="pool" aria-selected="true">Pool</button>
        <button role="tab" id="tab-sessions" aria-controls="sessions" aria-selected="false" tabindex="-1">Sessions</button>
        <button role="tab" id="tab-policies" aria-controls="policies" aria-selected="false" tabindex="-1">Policies</button>
      </div>
      <p id="summary" class="muted"></p>
    </header>
    <main id="main">
      <section id="pool" role="tabpanel" aria-labelledby="tab-pool" tabindex="0"></section>
      <section id="sessions" role="tabpanel" aria-labelledby="tab-sessions" tabindex="0" hidden></section>
      <section id="policies" role="tabpanel" aria-labelledby="tab-policies" tabindex="0" hidden></section>
    </main>
    <footer class="muted">
      <span><kbd>⌃⌥⌘N</kbd> switch to the account with most quota, from anywhere</span>
      <span><kbd>⌃⌥⌘L</kbd> open this window</span>
      <span><kbd>⌘1</kbd>–<kbd>⌘3</kbd> sections</span>
      <span><kbd>⌘S</kbd> save rules</span>
    </footer>
    <div id="toasts" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>

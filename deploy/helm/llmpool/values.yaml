image:
  repository: ghcr.io/shakedaskayo/llmpool
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Where members' browsers and clients reach the server. Required, and https:
# clients refuse to send a credential anywhere else.
publicUrl: ""

# Sign-in through any OpenID Connect provider (Google, Okta, Keycloak, Entra).
# Register {publicUrl}/auth/callback as the redirect address there.
# Leave clientId empty to run with API keys only.
oidc:
  issuer: https://accounts.google.com
  clientId: ""
  clientSecret: ""
  # Who may sign in. With sign-in on, at least one of these is required.
  allowedDomains: []
  allowedEmails: []

# Members who connect with a key instead of signing in: name -> key, each key
# at least 24 characters (e.g. `openssl rand -hex 24`).
apiKeys: {}

# Keep the secrets out of your values: name a Secret you manage yourself with
# the keys LLMPOOL_VAULT_KEY, and LLMPOOL_OIDC_CLIENT_SECRET and/or
# LLMPOOL_API_KEYS (`name:key` pairs, one per line). When set,
# oidc.clientSecret, apiKeys and vaultKey are ignored.
existingSecret: ""

# Be a gateway: members' agents send their requests to the server, which
# forwards each to the provider on an account it picks. No login or key leaves
# the server, and switching accounts happens here. Off, accounts are lent to
# members' machines. Administrators can change it on the server's page.
gateway:
  enabled: false
  # Move a provider's address, e.g. to your own proxy: provider -> URL.
  upstreams: {}
  # How many requests may be in flight at once. Each is a thread while it
  # runs; raise the memory limit with it.
  maxInFlight: 256

# Who may run the server from its web page (at publicUrl): addresses that may
# sign in, or names of API keys. Empty: the page is closed to everyone.
admins: []

# Which accounts each member may use, by tag (the starting point; administrators
# can change it on the server's page, and what they save there wins): a member (an address, an API
# key's name, `*@domain` or `*`) to the tags it opens (`*` for all). Empty:
# every member may use every account.
#   access:
#     "*@example.com": [work]
#     "lead@example.com": ["*"]
#     ci: [ci]
access: {}

# Members turned away even though sign-in or a key would admit them.
blocked: []

# Logins on the volume are encrypted with this key. Left empty, one is made at
# install and kept in the release's Secret (which survives `helm uninstall`:
# without the key the pool on the volume cannot be read). With existingSecret,
# put it there as LLMPOOL_VAULT_KEY (32+ random characters). If you render the
# chart without the cluster (helm template, Argo CD, Flux), set it here or in
# existingSecret: a rendered chart cannot see the key it made before.
vaultKey: ""

# Off: a subscription login in use by one member is not lent to another.
# Providers license such logins per person; turn this on only where yours
# allows several people on one login.
shareLogins: false

# The pool itself (accounts, their logins, members' sessions) lives here.
# Use a storage class that encrypts at rest: logins are stored as files.
persistence:
  size: 1Gi
  storageClass: ""
  existingClaim: ""

service:
  type: ClusterIP
  port: 80
  # For a cloud load balancer that terminates TLS itself (type LoadBalancer,
  # port 443): its certificate and listener settings go here.
  annotations: {}

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  # Name of a TLS secret for the host; empty leaves TLS to the controller.
  tlsSecret: ""

# Only let traffic in from these namespaces' pods (your ingress controller).
# The server's own outbound calls (the sign-in provider, token renewal) stay open.
networkPolicy:
  enabled: false
  ingressNamespaces: []

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    # Room for many requests in flight at once, some of them large; raise it
    # with gateway.maxInFlight.
    memory: 1Gi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

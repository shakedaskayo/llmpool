{{- if .Values.ingress.enabled }}
{{- $host := .Values.ingress.host | default (trimPrefix "https://" .Values.publicUrl) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "llmpool.name" . }}
  labels: {{- include "llmpool.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    - hosts: [{{ $host | quote }}]
      {{- with .Values.ingress.tlsSecret }}
      secretName: {{ . }}
      {{- end }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "llmpool.name" . }}
                port:
                  name: http
{{- end }}

{{- include "llmpool.validate" . }}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llmpool.name" . }}
  labels: {{- include "llmpool.labels" . | nindent 4 }}
  annotations:
    # Holds the key the pool on the volume is sealed with.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- $kept := "" }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "llmpool.name" .) }}
  {{- if and $existing $existing.data }}
  {{- $kept = get $existing.data "LLMPOOL_VAULT_KEY" | default "" | b64dec }}
  {{- end }}
  LLMPOOL_VAULT_KEY: {{ .Values.vaultKey | default $kept | default (randAlphaNum 48) | quote }}
  {{- if .Values.oidc.clientId }}
  LLMPOOL_OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
  {{- if .Values.apiKeys }}
  LLMPOOL_API_KEYS: |-
    {{- range $name, $key := .Values.apiKeys }}
    {{ $name }}:{{ $key }}
    {{- end }}
  {{- end }}
{{- end }}

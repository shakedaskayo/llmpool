{{- include "llmpool.validate" . }}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llmpool.name" . }}
  labels: {{- include "llmpool.labels" . | nindent 4 }}
  annotations:
    # Holds the key the pool on the volume is sealed with.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  {{- $kept := "" }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace (include "llmpool.name" .) }}
  {{- if and $existing $existing.data }}
  {{- $kept = get $existing.data "LLMPOOL_VAULT_KEY" | default "" | b64dec }}
  {{- end }}
  {{- /* A new key on an upgrade would make the pool on the volume
         unreadable. Without the cluster to ask (helm template, GitOps
         renders) the old key cannot be seen, so it must be given. */}}
  {{- if and .Release.IsUpgrade (not .Values.vaultKey) (not $kept) }}
  {{- fail "the vault key of this release cannot be read from the cluster; set vaultKey (or existingSecret) so the pool on the volume stays readable" }}
  {{- end }}
  LLMPOOL_VAULT_KEY: {{ .Values.vaultKey | default $kept | default (randAlphaNum 48) | quote }}
  {{- if gt (int .Values.gateway.replicas) 0 }}
  {{- $between := "" }}
  {{- if and $existing $existing.data }}
  {{- $between = get $existing.data "LLMPOOL_REPLICA_KEY" | default "" | b64dec }}
  {{- end }}
  LLMPOOL_REPLICA_KEY: {{ $between | default (randAlphaNum 48) | quote }}
  {{- end }}
  {{- if .Values.oidc.clientId }}
  LLMPOOL_OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
  {{- $otlp := .Values.gateway.otlp | default dict }}
  {{- if $otlp.headers }}
  {{- $pairs := list }}
  {{- range $name, $value := $otlp.headers }}
  {{- $pairs = append $pairs (printf "%s=%s" $name $value) }}
  {{- end }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ join "," $pairs | quote }}
  {{- end }}
  {{- if .Values.apiKeys }}
  LLMPOOL_API_KEYS: |-
    {{- range $name, $key := .Values.apiKeys }}
    {{ $name }}:{{ $key }}
    {{- end }}
  {{- end }}
{{- end }}

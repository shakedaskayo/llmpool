{{- include "llmpool.validate" . }}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "llmpool.name" . }}
  labels: {{- include "llmpool.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.oidc.clientId }}
  LLMPOOL_OIDC_CLIENT_SECRET: {{ .Values.oidc.clientSecret | quote }}
  {{- end }}
  {{- if .Values.apiKeys }}
  LLMPOOL_API_KEYS: |-
    {{- range $name, $key := .Values.apiKeys }}
    {{ $name }}:{{ $key }}
    {{- end }}
  {{- end }}
{{- end }}

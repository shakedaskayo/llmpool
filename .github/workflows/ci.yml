name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    # macOS: the GUI crate links the system web view, and the Keychain code
    # paths are the ones users run.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      # The app bundles the command line tool; its build looks for it.
      - name: Command line tool for the app
        run: scripts/prepare-sidecar.sh
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
        env:
          LLMPOOL_NO_NOTIFY: "1"

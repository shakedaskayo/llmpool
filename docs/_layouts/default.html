<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}llmpool</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="frame">
  <nav aria-label="Documentation">
    <a class="brand" href="{{ '/' | relative_url }}"><span class="mark" aria-hidden="true"></span>llmpool</a>
    <ul>
      {% for item in site.nav %}<li><a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title }}</a></li>
      {% endfor %}
    </ul>
    <a class="source" href="https://github.com/shakedaskayo/llmpool">Source on GitHub</a>
  </nav>
  <main id="main">
    {{ content }}
  </main>
</div>
</body>
</html>
